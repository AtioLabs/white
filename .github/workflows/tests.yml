name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install pytest pyyaml
      - name: Unit tests
        run: python -m pytest plugins bench -q -p no:cacheprovider
      - name: Core bench (no model needed)
        run: python bench/core_bench.py
